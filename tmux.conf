# Mouse support: click to focus panes, drag borders to resize, wheel to scroll
set -g mouse on

# Pass modified keys (Shift+Enter etc.) through to TUIs — pi warns without these
set -g extended-keys on
set -g extended-keys-format csi-u

# Activity: windows with monitor-activity flag highlight in the status bar,
# no popup messages (wt's windows layout enables the flag on agent windows)
set -g visual-activity off
set -g window-status-activity-style "bold,underscore"

# Window navigation: Alt+number jumps straight to a window (windows layout)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Pane navigation: Alt+arrows, no prefix needed (Ctrl-b + arrows still works)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
