# Mouse support: click to focus panes, drag borders to resize, wheel to scroll
set -g mouse on

# Pass modified keys (Shift+Enter etc.) through to TUIs — pi warns without these
set -g extended-keys on
set -g extended-keys-format csi-u

# Pane navigation: Alt+arrows, no prefix needed (Ctrl-b + arrows still works)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
