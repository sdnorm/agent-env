# wt agent roster: name | pane command | routing notes | mode
#
# The FIRST entry is the driver (big top-left pane); the rest are workers.
# mode (4th field): blank/auto = launched with every session;
#                   demand = not launched at start, but any agent can bring it
#                   into the session later with `agent-mail spawn <name>`.
# Override per-repo with a .wt-agents file (same format) in the main checkout,
# or per-session with WT_<NAME>_CMD env vars (auto agents only).
claude | claude | DRIVER — architecture, integration, credential/production work (has the approval gate), final review |
pi | ollama launch pi --model kimi-k3:cloud | tests, isolated refactors, research/summaries, docs |
grok | grok | UI iteration, quick prototypes, parallel investigations, second opinions |
codex | codex | OpenAI Codex — cross-checks, second opinions, alternative implementations | demand
