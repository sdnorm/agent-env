# wt agent roster: name | pane command | routing notes (shown to the driver)
#
# The FIRST entry is the driver (big top-left pane); the rest are workers
# stacked below it. Override per-repo with a .wt-agents file (same format) in
# the main checkout, or per-session with WT_<NAME>_CMD env vars.
claude | claude | DRIVER — architecture, integration, credential/production work (has the approval gate), final review
pi | ollama launch pi --model kimi-k3:cloud | tests, isolated refactors, research/summaries, docs
grok | grok | UI iteration, quick prototypes, parallel investigations, second opinions
